# Vaultwarden 密码管理插件：网页经核心网关打开，登录走核心的身份提供方（SSO_*，1.37 起的 OIDC 变量）。
# 直连取舍见 README 的“Bitwarden 客户端直连”。
services:
  vaultwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    # 上游镜像能以任意 uid 运行：数据目录属主是 PUID:PGID，容器就用它跑，不留在 root。
    user: "${PUID}:${PGID}"
    environment:
      # 上游镜像默认 80，非 root 监听不了特权端口，换高位端口。
      ROCKET_PORT: "8222"
      # SSO 回调地址由 DOMAIN 生成（<DOMAIN>/identity/connect/oidc-signin），必须和核心登记的
      # 回调路径一致；经网关访问时就是插件的网页地址。
      DOMAIN: ${WONTON_APP_URL}
      # 邮箱注册只关这一项，SSO 建号走 SSO_SIGNUPS_ALLOWED（默认开）：唯一账号由本人第一次 SSO 登录创建。
      SIGNUPS_ALLOWED: "false"
      # 网关重新设置 X-Forwarded-For，按它取客户端地址，登录限速才按真人算。
      IP_HEADER: X-Forwarded-For
      TZ: ${TZ}
      # 1.37 起的 SSO_* 变量，值来自核心注入的 OIDC 客户端。
      SSO_ENABLED: "true"
      # 保留邮箱+主密码登录：Bitwarden 客户端直连（局域网开关、公网接入）走不了核心的登录页。
      SSO_ONLY: "false"
      SSO_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      SSO_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      SSO_AUTHORITY: ${WONTON_OIDC_ISSUER}
    volumes:
      # SQLite 数据库、附件、图标缓存都在 /data，一个目录全带上。
      - ${WONTON_APP_DATA}:/data
    # /alive 会真的查一次数据库连接（源码里 alive 带 DbConn）；--noproxy 免受出网代理变量影响。
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "--show-error", "http://127.0.0.1:8222/alive"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

x-wonton:
  spec: "0.6"
  id: app.vaultwarden.vaultwarden
  version: 0.1.0
  kind: app
  title: { en: Vaultwarden }
  description:
    zh: 自托管密码管理，存密码、密钥和银行卡，多端同步
    en: Self-hosted password manager for logins, keys and cards, synced across your devices
  icon: icon.svg
  notices: [NOTICE]
  screenshots:
    - screenshots/item-detail.png
    - screenshots/generator.png
    - screenshots/new-item.png
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://github.com/dani-garcia/vaultwarden
  # 上游应用的许可证；插件包自己的许可证在仓库的 LICENSE（MIT）里。
  license: AGPL-3.0-only
  tags:
    zh: [安全, 密码管理]
    en: [Security, Passwords]
  about:
    zh: |
      在自己家里放一个密码库：登录、身份、支付卡和安全笔记都存本地，密码库数据不出家门。

      现在能用的：经云吞网关打开 Vaultwarden 的网页，用云吞的身份单点登录（OIDC），不用另记服务端密码。

      现在还用不了：Vaultwarden 自带的网页密码库，以及 Bitwarden 官方客户端（浏览器扩展、桌面版、手机 App、
      命令行）。它们只接受 https:// 地址，要等云吞提供公网入口（以后提供）才能用。

      需要访问外网：抓取条目里网站的图标。
    en: |
      Keep your password vault at home: logins, identities, cards and secure notes stay on your own server and
      never leave home.

      What works now: open Vaultwarden through the Wonton gateway and sign in with your Wonton identity (OIDC
      single sign-on); no extra server password to remember.

      Not yet: the Vaultwarden web vault and the official Bitwarden apps (browser extension, desktop, mobile,
      CLI). They only accept https:// addresses, so they need the public entry point Wonton will provide later.

      Needs internet access to fetch website icons for your items.
  release_notes:
    zh: 首个版本：云吞单点登录。网页密码库和 Bitwarden 客户端要等公网入口（https）。
    en: "First release: Wonton single sign-on. The web vault and Bitwarden apps need the upcoming public https entry point."
  webui:
    service: vaultwarden
    port: 8222
    sso: oidc
    oidc:
      # vaultwarden 的 SSO 回调路径由 DOMAIN 生成：<DOMAIN>/identity/connect/oidc-signin。
      redirect_paths: [/identity/connect/oidc-signin]
  # Bitwarden 客户端直连的入口：默认关，插件详情页的开关打开后 8222 开在局域网地址上，
  # 客户端用邮箱+主密码登录（见 about 和 README 的取舍说明）。
  lan:
    ports:
      - { service: vaultwarden, port: 8222 }
  permissions:
    # 局域网端口：Bitwarden 客户端直连的入口，默认关。
    - network.lan
    # 抓取条目网站的图标；密码库本身不出网。
    - network.egress
  # 上游没写最低内存；本机空闲实测约 15M（docker stats，装完含建库），取 128M。上游多架构清单含 amd64 和 arm64（经 registry API 核对 1.37.5）。
  requirements:
    arch: [amd64, arm64]
    memory: 128M
